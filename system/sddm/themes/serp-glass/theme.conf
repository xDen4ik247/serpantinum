[General]
# Defaults. ~/.local/bin/greeter-sync writes theme.conf.user (symlinked to
# /var/lib/serp-greeter/theme.conf.user) which overrides these.
background=assets/bg.jpg
backgroundBlur=assets/bg-blur.jpg
avatar=
base="#090f10"
mantle="#161d1d"
text="#dde4e4"
subtext="#bec8c9"
muted="#899393"
accent="#80d4db"
accent2="#b7c7ea"
accentInk="#004f54"
error="#ffb4ab"
# idle view shows the sharp wallpaper; false = always blurred
idleSharp=true
# seconds without input before returning to the clock view
idleSeconds=40
font="Google Sans"
iconFont="JetBrainsMono Nerd Font"
# top-right label; empty = the hostname (upper-cased). Machine-local value: put
# deviceLabel=... in ~/.config/serp-glass/greeter.conf, greeter-sync copies it to theme.conf.user
deviceLabel=
