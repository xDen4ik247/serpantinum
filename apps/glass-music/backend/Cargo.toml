[package]
name = "glass-music-backend"
version = "0.1.0"
edition = "2021"
description = "Glass Music's window backend (a Rust port of glassmusic.server)"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-normalization = "0.1"
sha1_smol = { version = "1", features = ["std"] }
md5 = "0.7"
native-tls = "0.2"
libc = "0.2"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
