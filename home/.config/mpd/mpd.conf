# Music Player Daemon — runs as a systemd *user* service (systemctl --user status mpd).
# Library: ~/Music  (<Artist>/<Album>/<NN - Title>.m4a + .lrc + cover.jpg)
# Clients: rmpc (Mod+Shift+M), mpc, and mpd-mpris → MPRIS → bar / music panel / playerctl.

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
sticker_file        "~/.local/share/mpd/sticker.sql"
state_file          "~/.local/state/mpd/state"

# Local only: a private unix socket (mpd-mpris needs it to learn music_directory and
# publish file:// URLs, which the lyrics use) plus loopback TCP for rmpc/mpc.
bind_to_address     "$XDG_RUNTIME_DIR/mpd/socket"
bind_to_address     "127.0.0.1"
port                "6600"
zeroconf_enabled    "no"

# New downloads in ~/Music appear without a manual rescan (inotify).
auto_update         "yes"
# After login the queue is restored but never starts playing by itself.
restore_paused      "yes"
# Remember the queue/position often enough to survive a crash or power loss.
state_file_interval "60"

filesystem_charset  "UTF-8"
# The library has no ReplayGain tags; keep levels exactly as mastered.
replaygain          "off"

audio_output {
    type            "pipewire"
    name            "PipeWire"
}
