# Talk to MPD over its private unix socket: only "local" clients may read
# music_directory, which mpd-mpris needs to publish xesam:url = file://… (used by
# the Serpantinum lyrics) and cover art.
[Unit]
BindsTo=mpd.service
PartOf=mpd.service
After=mpd.service

[Service]
ExecStart=
ExecStart=/usr/bin/mpd-mpris -no-instance -network unix -host %t/mpd/socket
Restart=on-failure
RestartSec=2
