# Personal kitty tweaks. kitty.conf is Serpantinum's file; this one is yours.

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Liquid glass: kitty's background is see-through and niri blurs the wallpaper
# behind it (see ~/.config/niri/user/rules.kdl). Ctrl+Shift+A, then M/L, adjusts it live.
background_opacity 0.5
dynamic_background_opacity yes
window_padding_width 6 10
